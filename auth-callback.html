<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로그인 완료 · 붇다의 범어교실</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
        background: #fefcfa;
        color: #1b2422;
        padding: 1.5rem;
        text-align: center;
      }
      a {
        color: #2f5d50;
      }
    </style>
  </head>
  <body>
    <p>앱으로 돌아가는 중입니다…</p>
    <p><a id="open" href="#">앱 열기</a></p>
    <script>
      ;(function () {
        var q = window.location.search || ''
        var h = window.location.hash || ''
        var target = 'sambyakku://open/auth-callback' + q + h
        var link = document.getElementById('open')
        link.href = target
        window.location.replace(target)
        setTimeout(function () {
          link.textContent = '자동으로 안 열리면 여기를 누르세요'
        }, 800)
      })()
    </script>
  </body>
</html>
